name: iOS Build (Simulator)

# Собирает iOS-приложение под симулятор на Apple Silicon runner.
# Артефакт (.zip с .app) скачивается и запускается локально в Simulator.app.
#
# Запуск: вручную (кнопка Run workflow) или автоматически при пуше в ветки.

on:
  workflow_dispatch:      # ручной запуск
  push:
    branches: [ main, master ]
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios-simulator:
    runs-on: macos-26      # macOS Tahoe, Xcode 26.4+ (читает pbxproj objectVersion 77)
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Select latest Xcode
        run: |
          # находим самую свежую версию Xcode из установленных
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selected: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcrun xcodebuild -version

      - name: Show environment
        run: |
          uname -m
          xcrun xcodebuild -version
          sw_vers

      - name: Build Shared framework (IosSimulatorArm64)
        run: |
          # очищаем кеш Kotlin/Native, чтобы исключить повреждённые klib
          rm -rf ~/.konan/klib ~/.gradle/caches/transforms ~/.gradle/caches/modules-2/files-2.1/org.jetbrains.androidx.navigation
          ./gradlew :shared:clean :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace

      - name: Build iOS app for Simulator
        run: |
          xcrun xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Locate .app and zip it
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -name "CashBuddy.app" -type d | head -1)
          echo "Found app: $APP_PATH"
          if [ -z "$APP_PATH" ]; then echo "App not found!"; exit 1; fi
          mkdir -p artifact
          cp -R "$APP_PATH" artifact/
          cd artifact
          zip -ry ../CashBuddy-iOS-Simulator.app.zip CashBuddy.app
          cd ..
          ls -la artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CashBuddy-iOS-Simulator
          path: CashBuddy-iOS-Simulator.app.zip
          retention-days: 30
