name: iOS Build

# Собирает iOS-приложение: симулятор (arm64) и .ipa для реального iPhone.
# Запуск: вручную (Run workflow) или автоматически при пуше.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios-simulator-arm64:
    runs-on: macos-26
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcrun xcodebuild -version
      - name: Build Shared (IosSimulatorArm64)
        run: |
          rm -rf ~/.konan/klib ~/.gradle/caches/transforms
          ./gradlew :shared:clean :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace
      - name: Build .app (arm64 simulator)
        run: |
          xcrun xcodebuild \
            -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -sdk iphonesimulator -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build
      - name: Zip .app
        run: |
          APP=$(find build/DerivedData/Build/Products -name "CashBuddy.app" -type d | head -1)
          mkdir -p artifact && cp -R "$APP" artifact/
          cd artifact && zip -ry ../CashBuddy-iOS-arm64.app.zip CashBuddy.app
      - uses: actions/upload-artifact@v4
        with:
          name: CashBuddy-iOS-arm64-simulator
          path: CashBuddy-iOS-arm64.app.zip
          retention-days: 30

  build-ios-device-ipa:
    runs-on: macos-26
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$LATEST/Contents/Developer"
      - name: Build Shared (IosArm64)
        run: |
          rm -rf ~/.konan/klib ~/.gradle/caches/transforms
          ./gradlew :shared:clean :shared:linkDebugFrameworkIosArm64 --no-daemon --stacktrace
      - name: Build unsigned .ipa
        run: |
          xcrun xcodebuild \
            -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -sdk iphoneos -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build
          APP=$(find build/DerivedData/Build/Products -name "CashBuddy.app" -type d | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -ry CashBuddy-device-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CashBuddy-iOS-device-ipa
          path: CashBuddy-device-unsigned.ipa
          retention-days: 30
